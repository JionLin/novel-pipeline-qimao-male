    action: 悬起麻绳重力铅锤，微调立柱垂直度
  - name: 自磨气泡水平管
    action: 水准管气泡在两条红线间轻微晃动，校准基座沉降
  - name: 划针与红松炭条
    action: 执起钢划针在冷铁皮上划出规整的下刀基准线
  - name: 测风羽毛与测距规
    action: 手举雀羽感受风向偏角，折扇式测距木规锁定距离
  life_sensory_details:
  - name: 炭火烘烤
    action: 将冻僵发青的指节悬在暗红炭火上缓缓烘烤，感受皮肉发胀的微温
  - name: 松针开水
    action: 端起粗瓷碗咽下一口带松脂清苦的热水，撕开胸腔深处的寒意
  - name: 粗布缠裹
    action: 取来细麻布死死缠紧开裂渗血的虎口，打下牢固的死结
  - name: 盐粒化水
    action: 在冰冷井水中融化少许粗盐，仰头咽下补充体力
