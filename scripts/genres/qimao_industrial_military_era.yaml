default_idea: 国宝级军工院士重生1982年，成了破产农机厂小厂长。面对西方技术封锁和催债大军，主角反手造出神级微型燃气轮机和精准制导火箭炮！中东土豪提着整箱黄金上门疯抢，国家部委连夜将小厂升级为绝密特种军工基地！
