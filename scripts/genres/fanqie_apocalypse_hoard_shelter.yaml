default_idea: "末世冰封降临，全人类陷入零下70度极寒天灾。被绿茶与恶邻背叛惨死的主角重生回天灾前一个月！觉醒千亿异能空间，搬空超级港口与跨国仓库！打造末日第一堡垒！当邻居饿得啃树皮求口水喝时，主角在安全屋里吃着顶级佛跳墙，反手一梭子送上门抢劫的恶霸上西天！"
