specific_rules: "- 前3章必须毫不犹豫撕破脸皮断绝关系，对偏心父母、养子弟弟和绿茶校花保持绝对冷酷与蔑视；\n- 搞钱链条必须真实硬核（互联网早期风口、外汇套利、独角兽投资）；\n- 每次主角取得重大财富成就，必须同步展现原家庭因失去主角而逐渐走向破产绝境的惨状；\n- 面对全家跪地求饶和校花哭求复合，主角直接关门无视，绝不圣母原谅！"
default_idea: "前世为偏心全家当牛做马，却被养子弟弟诬陷陷害致死。重生高考前夕，主角当着全家面撕碎户口本断绝关系！转头截胡千亿风口创立商业帝国！养子原形毕露全家破产，父母姐姐跪在庄园外痛哭求原谅，主角神色淡漠：“你们谁啊？不熟。”"
