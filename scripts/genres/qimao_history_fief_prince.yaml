specific_rules: '- 绝不在京城卷入低智宫斗，主角主动自污求贬边关；

  - 每一批次必须推进具体的军工科技升级（如黑火药配方、高炉炼钢、流水线燧发枪）；

  - 边境土著势力与外族骑兵必须作为战力试金石被成建制降维收割；

  - 朝廷诏令与太子算计到达时，主角必须通过军权硬实力展现‘将在外君命有所不受’的霸道。'
default_idea: 穿越成大乾王朝最不受待见的六皇子，装疯卖傻主动就藩苦寒北境。皇帝以为赶走了累赘，却不知主角手握现代工业系统，三年后十万钢铁洪流横扫漠北，全天下哭求六皇子登基！
