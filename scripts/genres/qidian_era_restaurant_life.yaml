specific_rules: "- 菜品制作、火候把控、调味香料等烹饪细节必须专业考究（如豆瓣酱古法酿造、宫保鸡丁荔枝味型）；\n- 强化八十年代时代物价、粮票布票、国营饭店改制与市井弄堂的真实生活细节；\n- 情感线细腻质朴，拒绝狗血降智，突出亲情救赎与街坊互助的时代脉搏；\n- 商业版图从摆摊街边摊、破产小馆到打造全国连锁餐饮集团步步为营。"
default_idea: "国宴特级川菜大师重回1984年，接手濒临倒闭的街坊破产小饭馆。凭借一身出神入化的古法烹饪技艺，一道麻婆豆腐馋哭整条街，一碗开水白菜惊呆国营大饭店领导！带领家人从小饭馆做起，在时代的滚滚浪潮中打造享誉全球的中华美食帝国！"
