specific_rules: "- 主角内心吐槽必须幽默辛辣且充满超前历史见解；\n- 皇帝在偷听心声后雷厉风行，将奸臣底牌当场掀翻，形成强烈的朝堂反差与搞笑爽感；\n- 主角一心只想辞官回乡当富家翁，却被皇帝硬生生绑在首辅之位上步步高升；\n- 帝国国运与现代科技在主角的‘剧透’下飞速飙升。"
default_idea: "穿越大唐成了一名九品御史，早朝上只想默默打瞌睡摸鱼，内心疯狂吐槽：【李二啊李二，你今天封的大将军下个月就要起兵造反了，你最爱的贵妃今晚要给你下毒啦！】李世民当场从龙椅上跳起来：“给朕把那反贼拉出去斩了！”主角越想辞官，李二越是死活不放，硬生生把主角宠成当朝第一镇国帝师！"
